# Alternative: nginx terminates TLS on the SAME host as Orbit.
# Use only if this matches the inspected topology and certificate paths.
server {
    listen 80;
    server_name orbit.server-uniofweb.ru;
    return 308 https://orbit.server-uniofweb.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name orbit.server-uniofweb.ru;
    ssl_certificate /etc/letsencrypt/live/orbit.server-uniofweb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbit.server-uniofweb.ru/privkey.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /_orbit/ip/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        return 200 '{"ip":"$remote_addr"}';
    }
    location = /api/system/files/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
