[program:orbit-warmup]
directory=/var/www/orbit/current
command=/usr/local/bin/node --env-file=.env worker/warmup-service.mjs
user=www-data
environment=NODE_ENV="production",HOME="/var/lib/orbit/home",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
umask=0077
redirect_stderr=true
stdout_logfile=/var/log/supervisor/orbit-warmup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
