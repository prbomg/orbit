# Origin container behind the existing TLS-terminating nginx.
# The edge MUST overwrite X-Forwarded-Proto and redirect HTTP to HTTPS.
# Enable proxy, proxy_http, headers and rewrite. Do not serve the source directory.
<VirtualHost *:80>
    ServerName orbit.server-uniofweb.ru
    ProxyRequests Off
    ProxyPreserveHost On
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} !^https$ [NC]
    RewriteRule ^ https://orbit.server-uniofweb.ru%{REQUEST_URI} [R=308,L,NE]
    # Requires the existing PHP module and a verified mod_remoteip edge policy.
    # This endpoint is independent of Node.js/Next.js availability.
    ProxyPass /_orbit/ip/ !
    Alias /_orbit/ip/ /var/lib/orbit/ip-check/ip-check.php
    <Directory /var/lib/orbit/ip-check>
        Options -Indexes
        AllowOverride None
        <Files ip-check.php>
            Require all granted
            SetHandler application/x-httpd-php
        </Files>
    </Directory>
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/
    LimitRequestBody 1048576
    <LocationMatch "^/api/system/files/?$">
        LimitRequestBody 20971520
    </LocationMatch>
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/orbit-error.log
    CustomLog ${APACHE_LOG_DIR}/orbit-access.log combined
</VirtualHost>
