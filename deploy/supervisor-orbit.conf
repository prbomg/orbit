; This container runs without systemd. Next loads /var/lib/orbit/.env via .env symlink.
[program:orbit]
directory=/var/www/orbit/current
command=/usr/local/bin/node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
user=www-data
environment=NODE_ENV="production",HOME="/var/lib/orbit/home",NEXT_TELEMETRY_DISABLED="1",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
umask=0077
redirect_stderr=true
stdout_logfile=/var/log/supervisor/orbit.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
